name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --dev
      - run: uv run ruff check app examples migrations scripts src tests
      - run: uv run ruff format --check app examples migrations scripts src tests

  test:
    name: test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported versions, as the README lists them.
        postgres: ["16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: invariant
          POSTGRES_USER: invariant
          POSTGRES_PASSWORD: invariant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invariant -d invariant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://invariant:invariant@localhost:5432/invariant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --dev
      - name: Migrations apply, match the models, and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Tests on SQLite
        run: uv run pytest
      - name: Tests on PostgreSQL
        run: uv run pytest
        env:
          INVARIANT_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and smoke-test the Compose stack
        # Migrations, health checks, the webhook through the worker to a
        # comment, restarts, and a backup restored into a new database.
        run: python3 scripts/compose_smoke.py

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff-mode check below needs the pull request's base commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Install it into a clean environment
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl pytest
      - name: CLI tests against the installed command, outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          INVARIANT_CLI: ${{ runner.temp }}/clean/bin/invariant
        run: |
          "$RUNNER_TEMP/clean/bin/python" -m pytest --noconftest -p no:cacheprovider \
            --rootdir "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tests/test_cli_process.py"
      - name: This repository passes its own rules
        run: |
          "$RUNNER_TEMP/clean/bin/invariant" check .
      - name: So do the changes of this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/clean/bin/invariant" check . --base "$BASE" --head "$HEAD"
