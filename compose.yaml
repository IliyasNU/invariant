x-environment: &environment
  POSTGRES_DB: ${POSTGRES_DB:-invariant}
  POSTGRES_USER: ${POSTGRES_USER:-invariant}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invariant}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_POST_PR_COMMENT: ${GITHUB_POST_PR_COMMENT:-false}
  GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
  # Passed on only when set, in .env or the shell; otherwise the defaults hold.
  # Without INVARIANT_API_KEY or INVARIANT_LOCAL_ONLY the API does not start.
  INVARIANT_API_KEY:
  INVARIANT_LOCAL_ONLY:
  INVARIANT_CORS_ORIGINS:
  INVARIANT_PUBLIC_URL:
  INVARIANT_MAX_BODY_BYTES:
  INVARIANT_RATE_LIMIT_PER_MINUTE:
  INVARIANT_AUTH_FAILURES_PER_MINUTE:
  INVARIANT_MAX_CONCURRENT_ANALYSES:
  INVARIANT_LOG_FORMAT:
  INVARIANT_LOG_LEVEL:
  WORKER_MAX_ATTEMPTS:
  WORKER_LEASE_SECONDS:
  WORKER_JOB_SECONDS:
  WORKER_RETRY_SECONDS:
  WORKER_POLL_SECONDS:

services:
  # Applies the migrations once, before the API and the worker start.
  migrate:
    build: .
    image: invariant
    environment: *environment
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"

  app:
    image: invariant
    environment: *environment
    ports:
      # Loopback only: publish the API through a TLS-terminating proxy.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "--no-sync", "python", "-m", "app.server"]
    healthcheck:
      # Ready: the database answers and its schema is this version's.
      test: ["CMD", "python", "-m", "app.healthcheck", "api"]
      interval: 10s
      timeout: 7s
      retries: 3
      start_period: 15s

  # Runs the queued GitHub analyses. On SIGTERM it finishes the current run.
  worker:
    image: invariant
    environment: *environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    healthcheck:
      # Alive: the worker touched its heartbeat within the lease.
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 2m
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invariant}
      POSTGRES_USER: ${POSTGRES_USER:-invariant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invariant}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
