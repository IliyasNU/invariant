x-environment: &environment
  POSTGRES_DB: ${POSTGRES_DB:-invariant}
  POSTGRES_USER: ${POSTGRES_USER:-invariant}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invariant}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_POST_PR_COMMENT: ${GITHUB_POST_PR_COMMENT:-false}
  GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}

services:
  # Applies the migrations once, before the API and the worker start.
  migrate:
    build: .
    image: invariant
    environment: *environment
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"

  app:
    image: invariant
    environment: *environment
    ports:
      # Loopback only: the API has no authentication yet.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Runs the queued GitHub analyses. On SIGTERM it finishes the current run.
  worker:
    image: invariant
    environment: *environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    stop_grace_period: 2m
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invariant}
      POSTGRES_USER: ${POSTGRES_USER:-invariant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invariant}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
